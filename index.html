<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prince Raj Live</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:Arial,sans-serif}
#app{position:fixed;inset:0;background:#000}
#player{width:100%;height:100%;border:0;display:block;background:#000}
#message{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:#05070b;color:#fff;text-align:center;padding:24px;z-index:2
}
.card{max-width:520px;padding:28px;border:1px solid #242b36;border-radius:16px;background:#10141b}
.card h1{font-size:24px;margin-bottom:10px}
.card p{color:#9ba5b5;line-height:1.5;font-size:14px}
.card code{display:block;margin-top:14px;padding:10px;background:#07090d;border-radius:8px;color:#8cc8ff;word-break:break-all}
</style>
</head>
<body>
<div id="app">
  <iframe id="player"
    allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
    allowfullscreen
    webkitallowfullscreen
    scrolling="no"></iframe>

  <div id="message">
    <div class="card">
      <h1>Prince Raj Live</h1>
      <p>No authorized embed URL was supplied.</p>
      <p>Open this page with <b>?id=</b> followed by the official embed URL.</p>
      <code>https://YOUR-SITE/?id=YOUR-AUTHORIZED-EMBED-URL</code>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const source = params.get("id");
const iframe = document.getElementById("player");
const message = document.getElementById("message");

if (source) {
  try {
    const url = new URL(source);
    if (url.protocol === "https:" || url.protocol === "http:") {
      iframe.src = url.href;
      message.style.display = "none";
    }
  } catch (_) {}
}
</script>
</body>
</html>
