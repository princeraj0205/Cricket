<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Prince Raj Live</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    font-family:Arial,sans-serif;
}

.player{
    position:fixed;
    inset:0;

    width:100vw;
    height:100vh;
    height:100dvh;

    background:#000;
    overflow:hidden;
}

iframe{
    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;

    border:0;
    outline:0;

    background:#000;

    display:block;
}

.error{
    position:absolute;
    inset:0;

    display:none;
    align-items:center;
    justify-content:center;

    background:#000;
    color:white;

    text-align:center;

    padding:20px;

    z-index:20;
}

.error-box{
    max-width:500px;
}

.error h2{
    margin-bottom:10px;
}

.error p{
    color:#999;
    font-size:14px;
    line-height:1.5;
}

</style>
</head>

<body>

<div class="player">

    <iframe
        id="liveFrame"
        allow="
            autoplay;
            encrypted-media;
            fullscreen;
            picture-in-picture
        "
        allowfullscreen
        webkitallowfullscreen
        mozallowfullscreen
        scrolling="no">
    </iframe>

    <div class="error" id="error">

        <div class="error-box">

            <h2>Video Link Missing</h2>

            <p>
                Please open this page with an authorized
                embed URL using the ?id= parameter.
            </p>

        </div>

    </div>

</div>


<script>

const params =
    new URLSearchParams(
        window.location.search
    );

const source =
    params.get("id");

const iframe =
    document.getElementById("liveFrame");

const error =
    document.getElementById("error");


if(source){

    try{

        const url =
            new URL(source);

        if(
            url.protocol === "https:" ||
            url.protocol === "http:"
        ){

            iframe.src =
                url.href;

        }else{

            error.style.display =
                "flex";

        }

    }catch(e){

        error.style.display =
            "flex";

    }

}else{

    error.style.display =
        "flex";

}

</script>

</body>
</html>
