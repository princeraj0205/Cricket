<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prince Raj Live</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    font-family:Arial,sans-serif;
}

body{
    overflow:hidden;
}

.player{
    position:fixed;
    inset:0;
    background:#000;
    overflow:hidden;
}

video{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
    background:#000;
}

/* Loading */

.loading{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.45);
    z-index:5;
    pointer-events:none;
    opacity:0;
}

.loading.show{
    opacity:1;
}

.loader{
    width:45px;
    height:45px;
    border:4px solid #444;
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

/* Top branding */

.brand{
    position:absolute;
    top:18px;
    left:20px;
    z-index:10;

    padding:8px 12px;
    border-radius:8px;

    background:rgba(0,0,0,.65);
    color:white;

    font-size:13px;
    font-weight:bold;

    pointer-events:none;
}

/* Controls */

.controls{
    position:absolute;
    left:0;
    right:0;
    bottom:0;

    padding:45px 18px 16px;

    background:linear-gradient(
        transparent,
        rgba(0,0,0,.9)
    );

    z-index:10;

    opacity:0;
    transition:.25s;
}

.player:hover .controls,
.player.show-controls .controls{
    opacity:1;
}

.progress{
    width:100%;
    height:4px;
    cursor:pointer;
    margin-bottom:12px;
}

.row{
    display:flex;
    align-items:center;
    gap:10px;
}

button{
    border:0;
    background:transparent;
    color:white;
    cursor:pointer;

    width:38px;
    height:38px;

    font-size:20px;
}

.spacer{
    flex:1;
}

.live{
    color:#fff;
    font-size:12px;
    font-weight:bold;
}

.red{
    color:#ff2222;
}

/* Error */

.message{
    position:absolute;
    inset:0;

    display:none;
    align-items:center;
    justify-content:center;

    text-align:center;
    padding:25px;

    color:white;
    background:#000;

    z-index:20;
}

.message-box{
    max-width:450px;
}

.message h2{
    margin-bottom:10px;
}

.message p{
    color:#999;
    line-height:1.5;
    font-size:14px;
}

/* Mobile */

@media(max-width:600px){

    .brand{
        top:10px;
        left:10px;
        font-size:11px;
    }

    .controls{
        opacity:1;
        padding:35px 10px 8px;
    }

    button{
        width:34px;
        height:34px;
    }
}
</style>
</head>

<body>

<div class="player" id="player">

    <div class="brand">
        Prince Raj Live
    </div>

    <video
        id="video"
        playsinline
        preload="auto">
    </video>

    <div class="loading" id="loading">
        <div class="loader"></div>
    </div>

    <div class="controls">

        <input
            class="progress"
            id="progress"
            type="range"
            min="0"
            max="100"
            value="0">

        <div class="row">

            <button id="play">
                ▶
            </button>

            <button id="mute">
                🔊
            </button>

            <span class="live">
                <span class="red">●</span>
                LIVE
            </span>

            <div class="spacer"></div>

            <button id="fullscreen">
                ⛶
            </button>

        </div>

    </div>

    <div class="message" id="message">

        <div class="message-box">

            <h2>Unable to Load Stream</h2>

            <p id="messageText">
                Please check the authorized stream URL.
            </p>

        </div>

    </div>

</div>


<script>

/*
==================================================
YOUR AUTHORIZED DIRECT STREAM
==================================================

Put the direct .m3u8 URL here.

Example:

const STREAM_URL =
"https://example.com/live/channel.m3u8";

DO NOT put a webpage URL here.
*/

const STREAM_URL =
"YOUR_AUTHORIZED_M3U8_URL";


const video =
document.getElementById("video");

const player =
document.getElementById("player");

const loading =
document.getElementById("loading");

const message =
document.getElementById("message");

const messageText =
document.getElementById("messageText");

const playBtn =
document.getElementById("play");

const muteBtn =
document.getElementById("mute");

const fullscreenBtn =
document.getElementById("fullscreen");

const progress =
document.getElementById("progress");


let hls = null;


/* Error */

function showError(text){

    loading.classList.remove("show");

    message.style.display = "flex";

    messageText.textContent = text;
}


/* Load stream */

function loadStream(){

    if(
        !STREAM_URL ||
        STREAM_URL ===
        "YOUR_AUTHORIZED_M3U8_URL"
    ){

        showError(
            "Add your authorized direct .m3u8 stream URL in STREAM_URL."
        );

        return;
    }


    loading.classList.add("show");


    /* HLS.js */

    if(
        STREAM_URL.includes(".m3u8") &&
        window.Hls &&
        Hls.isSupported()
    ){

        hls = new Hls();

        hls.loadSource(STREAM_URL);

        hls.attachMedia(video);


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function(){

                loading.classList.remove("show");

                video.play().catch(function(){});

            }
        );


        hls.on(
            Hls.Events.ERROR,
            function(event,data){

                if(data.fatal){

                    showError(
                        "The stream could not be loaded. Check the stream URL and server permissions."
                    );

                }

            }
        );

    }

    /* Safari */

    else if(
        STREAM_URL.includes(".m3u8") &&
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src = STREAM_URL;

        video.addEventListener(
            "loadedmetadata",
            function(){

                loading.classList.remove("show");

                video.play().catch(function(){});

            },
            {once:true}
        );

    }

    /* Normal MP4/WebM */

    else{

        video.src = STREAM_URL;

        video.addEventListener(
            "loadedmetadata",
            function(){

                loading.classList.remove("show");

            },
            {once:true}
        );

    }
}


/* Play */

playBtn.addEventListener(
    "click",
    function(){

        if(video.paused){

            video.play();

        }else{

            video.pause();

        }

    }
);


/* Update play icon */

video.addEventListener(
    "play",
    function(){

        playBtn.textContent = "❚❚";

    }
);

video.addEventListener(
    "pause",
    function(){

        playBtn.textContent = "▶";

    }
);


/* Mute */

muteBtn.addEventListener(
    "click",
    function(){

        video.muted = !video.muted;

        muteBtn.textContent =
            video.muted ? "🔇" : "🔊";

    }
);


/* Fullscreen */

fullscreenBtn.addEventListener(
    "click",
    async function(){

        try{

            if(document.fullscreenElement){

                await document.exitFullscreen();

            }else{

                await player.requestFullscreen();

            }

        }catch(error){

            console.log(error);

        }

    }
);


/* Double-click video = fullscreen */

video.addEventListener(
    "dblclick",
    async function(){

        try{

            if(!document.fullscreenElement){

                await player.requestFullscreen();

            }else{

                await document.exitFullscreen();

            }

        }catch(error){}

    }
);


/* Loading */

video.addEventListener(
    "waiting",
    function(){

        loading.classList.add("show");

    }
);

video.addEventListener(
    "playing",
    function(){

        loading.classList.remove("show");

    }
);


/* Progress */

video.addEventListener(
    "timeupdate",
    function(){

        if(
            video.duration &&
            isFinite(video.duration)
        ){

            progress.value =
            (video.currentTime /
             video.duration) * 100;

        }

    }
);


progress.addEventListener(
    "input",
    function(){

        if(
            video.duration &&
            isFinite(video.duration)
        ){

            video.currentTime =
            (progress.value / 100) *
            video.duration;

        }

    }
);


/* Show controls on mobile tap */

player.addEventListener(
    "click",
    function(){

        player.classList.toggle(
            "show-controls"
        );

    }
);


/* Start */

loadStream();

</script>

</body>
</html>
