<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Prince Raj Live</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

.player {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    background: #000;
    overflow: hidden;
}

/* SOURCE */
#liveFrame {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    border: 0;
    display: block;

    background: #000;
}

/* OUR FULLSCREEN BUTTON */
.fullscreen-btn {
    position: absolute;

    right: 18px;
    bottom: 18px;

    width: 48px;
    height: 48px;

    border: 1px solid rgba(255,255,255,.25);
    border-radius: 12px;

    background: rgba(0,0,0,.75);
    color: #fff;

    font-size: 24px;

    cursor: pointer;

    z-index: 9999;

    backdrop-filter: blur(8px);

    transition: .2s;
}

.fullscreen-btn:hover {
    background: rgba(20,20,20,.95);
    transform: scale(1.06);
}

/* SMALL BRAND */
.brand {
    position: absolute;

    top: 15px;
    left: 18px;

    z-index: 9999;

    color: rgba(255,255,255,.8);

    font-size: 13px;
    font-weight: 600;

    background: rgba(0,0,0,.55);

    padding: 7px 11px;

    border-radius: 8px;

    pointer-events: none;
}

/* HIDE OUR BUTTON WHEN FULLSCREEN */
.player:fullscreen .fullscreen-btn {
    bottom: 22px;
    right: 22px;
}

.player:-webkit-full-screen .fullscreen-btn {
    bottom: 22px;
    right: 22px;
}

/* MOBILE */
@media (max-width: 600px) {

    .fullscreen-btn {
        width: 44px;
        height: 44px;

        right: 12px;
        bottom: 12px;

        font-size: 21px;
    }

    .brand {
        top: 10px;
        left: 10px;
        font-size: 11px;
    }
}
</style>
</head>

<body>

<div class="player" id="player">

    <div class="brand">
        Prince Raj Live
    </div>

    <iframe
        id="liveFrame"
        src="https://teamroifrmp3.pages.dev/?id=https://allrounder3-0.pages.dev/cricket/sony-3"
        allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
        allowfullscreen
        webkitallowfullscreen
        mozallowfullscreen
        scrolling="no">
    </iframe>

    <!-- OUR OWN FULLSCREEN BUTTON -->
    <button
        class="fullscreen-btn"
        id="fullscreenBtn"
        title="Fullscreen">
        ⛶
    </button>

</div>


<script>

const player =
    document.getElementById("player");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");


fullscreenBtn.addEventListener("click", async function(e) {

    e.preventDefault();
    e.stopPropagation();

    try {

        if (!document.fullscreenElement) {

            if (player.requestFullscreen) {

                await player.requestFullscreen();

            } else if (player.webkitRequestFullscreen) {

                player.webkitRequestFullscreen();

            }

        } else {

            if (document.exitFullscreen) {

                await document.exitFullscreen();

            }

        }

    } catch (error) {

        console.log(
            "Fullscreen error:",
            error
        );

    }

});


document.addEventListener(
    "fullscreenchange",
    function() {

        if (document.fullscreenElement) {

            fullscreenBtn.textContent = "✕";

        } else {

            fullscreenBtn.textContent = "⛶";

        }

    }
);

</script>

</body>
</html>
